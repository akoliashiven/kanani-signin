<!doctype html>
<!--
  The page the sign-in email lands on.

  Supabase's /verify answers the emailed link with a 303 to `redirect_to`.
  While that was `kanani://auth/callback`, the browser was asked to follow a
  redirect into a custom scheme with no tap behind it, and Chrome on iOS
  answers that with a blank page (builds 6 to 8, 2026-09-18/19). A redirect to
  an https page always renders, and a tap on a link to `kanani://` is a user
  gesture every iOS browser honours.

  The page holds no secret. The `code` it forwards is a PKCE auth code, useless
  without the verifier in the app's keychain on the phone that asked for it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Open Kanani</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 32px 24px calc(48px + env(safe-area-inset-bottom));
        background: #1c2a22;
        color: #f4f1e8;
        font:
          17px/1.45 -apple-system,
          BLinkMacSystemFont,
          'Helvetica Neue',
          sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font:
          400 40px/1.08 'New York',
          'Iowan Old Style',
          Georgia,
          serif;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 28px;
        max-width: 34ch;
        opacity: 0.82;
      }
      a.open {
        display: block;
        padding: 17px 24px;
        border-radius: 999px;
        background: #f4f1e8;
        color: #1c2a22;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="ready" hidden>
      <h1>One tap<br />to finish.</h1>
      <p>Open Kanani on this phone to complete your sign-in.</p>
      <a class="open" id="open" href="kanani://auth/callback">Open Kanani</a>
    </main>
    <main id="failed" hidden>
      <h1>This link<br />has expired.</h1>
      <p id="reason">Go back to Kanani and ask for a new sign-in email. Each link works once.</p>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        // Supabase reports a spent or expired link in the query, the fragment, or both.
        var fragment = new URLSearchParams(location.hash.replace(/^#/, ''));
        var code = params.get('code');
        var problem = params.get('error_description') || fragment.get('error_description');

        if (!code) {
          if (problem)
            document.getElementById('reason').textContent =
              problem.replace(/\+/g, ' ') + '. Go back to Kanani and ask for a new sign-in email.';
          document.getElementById('failed').hidden = false;
          return;
        }

        var target = 'kanani://auth/callback?code=' + encodeURIComponent(code);
        document.getElementById('open').href = target;
        document.getElementById('ready').hidden = false;
        // Take the code out of the address bar and history before anything else.
        history.replaceState(null, '', location.pathname);
        // Safari follows this on its own; where a browser ignores it, the button is the way in.
        location.href = target;
      })();
    </script>
  </body>
</html>
